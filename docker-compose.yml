services:
  vaisravana-alpha:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaisravana-alpha:latest
    container_name: bots-vaisravana-alpha
    restart: unless-stopped

    env_file: [.env]
    environment:
      ALPHA_DATA: /data
      ALPHA_MODE: paper
      TZ: UTC

    volumes:
      # Named volume, not a bind mount: the wallet and trade history are the
      # experiment's only durable output and must survive a rebuild.
      - alpha-data:/data

    # Bounded logs. An unbounded json-file driver on a bot emitting thousands
    # of ticks an hour will quietly fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    stop_grace_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  alpha-data:
    name: vaisravana-alpha-data
